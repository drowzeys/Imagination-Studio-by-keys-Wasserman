      { t: "Label every picture", d: ["Under each picture type who or what it is. The label is how your scene text points at the picture, so make it something you will repeat word for word."], eg: "Picture 1: the woman with red hair\nPicture 2: the brown leather jacket", tip: "Unlabeled pictures are only called “the main subject”. With two or more, the model cannot tell which is which.", go: go(1, "Add pictures", { start: "refs" }) },
      { t: "Write the scene with the same labels", d: ["Back in step 1, describe the new scene and use the labels exactly as typed. Do not leave the scene boxes empty: the pictures say who, the boxes say where and what."], eg: "Scene: The woman with red hair sits at a wooden desk in a small radio studio at night, wearing the brown leather jacket.\nWhat happens: She leans to the microphone and speaks, then smiles.", go: go(0, "Describe the scene", { start: "refs" }) },
      ...(S.ref_media ? [{ t: "Reference videos and audio", d: ["Step 2 also takes up to " + S.reference_video_limit + " videos and " + S.reference_audio_limit + " audio clips, each 2 to 15 seconds. A video carries a subject and its motion; an audio clip a voice or music. The prompt names them <Video 1> and <Audio 1>, and step 4 writes those names for you.", "Audio needs a picture or a video beside it. A reference video makes every pass slower, so start with a short one. A file that is too short, too long or silent is turned away as you add it, with the reason.", "To have someone say a recording, add it as audio and write its words as the spoken line in step 3: the clip then performs the recording. With other words, also describe the voice in the line's Voice box, or little of it comes across. A video's own sound can be a reference too: tick the box under the videos."], tip: "Under a video, say who it shows to keep that person; leave the box empty to borrow only the motion.", go: go(1, "Add videos", { start: "refs" }) },
        { t: "Motion of a reference video", d: ["Under the first video, Analyse motion runs Motion Previs on it: the camera move in words, a pose skeleton and a depth layer. Then choose what the clip keeps of the video (the full scene, the actor's motion, an object's path or only the camera) and what the model is given as <Video 1>.", "The source clip is the tested route: with a picture of someone else, the clip repeats the shot with that person in it. For a new place choose depth, sent as a control video with a picture of the opening frame: it kept the moves nearly as well in our tests. The skeleton holds the motion most loosely.", "Sound and movement keeps the two in step: Impacts is fast strikes and blocks with their sound, Flow is slow movement that is silent or under music, and Automatic never lays hits over a reference that moves slowly. A reference is followed at its own speed, so Impacts over a slow one leaves the video out and lets the picture and the prompt carry the fight."], tip: "The camera sentence is added to the prompt unless the Camera field of step 1 has text of its own.", go: go(1, "Add videos", { start: "refs" }) },
        { t: "A voice from the Voice tab", d: ["A Voice take can be the clip's reference audio. Under a take in the Voice tab, “Use as Ref2VA voice reference” opens this step with the take added as <Audio N>; a take longer than 15 seconds is cut to its first 15.", "Add a picture or a video of who speaks, write the take's words as the spoken line in step 3, and describe the same voice in the line's Voice box."], tip: "The clip follows the recording closely when the line is what it says. The voice is not an exact copy: describe it as well.", go: on("Voice", "Takes") }] : []),
      { t: "Passes and limits", d: [S.ref2va_turbo ? "20 passes is the model as released. Turbo 4 passes is about 2.5 times faster and good for trying ideas." : "Reference clips use 20 plain passes.", "Reference clips are at most 15 seconds and are slower than plain FastH3 clips."], tip: "Speech rules are the same as in “Speech, sound and music”: fit the line to the clip length.", go: go(0, "Reference to video", { start: "refs" }) } ] }] : []),
    { id: "long", track: "Create", title: "Videos longer than 15 seconds", sub: "chained clips and story beats", steps: [
      { t: "Pick a long length", d: ["The model makes at most 15 seconds at a time. Choose 30 seconds or more under Length, up to 30 minutes, and the app renders several 15 second clips, each opening on the last frame of the one before, then joins them.", "Each clip waits for the one before, so a long video renders on this machine alone, whatever the Sparks setting says."], tip: "Not available with references or a last frame. Only an 18 second chain has been checked by eye; longer times are estimates.", go: go(0, "Length", { start: "text" }) },
      { t: "Write story beats", d: ["With a long length a “Story beats” box appears. Write one line per 15 second clip, in order. The last line is used for every clip after it."], eg: "He rides down the chute.\nHe stops at the river and looks back.\nHe wades across carrying the bike.", tip: "Without beats every clip gets the same action, so the video repeats itself. “Show me in the app” sets the length to 30 seconds so the box is there.", go: go(0, "Story beats", { start: "text", seconds: "30" }) },
      { t: "What to expect", d: ["Finished clips appear in the queue as they land. The look drifts a little with every clip, so faces and colors change over a long video, and sound does not carry across a join. For a film where each part must look right, use Story → Film and check each segment."], go: go(0, "Length") },
      { t: "Lay a song under it", d: ["When the long video is done, step 5 has “Lay a song under it”. It opens the Music tab with this video chosen: make a song there, or pick one, press “Use as soundtrack” under it and then “Lay it under”.", "The song sits under the video's own sound and is lowered while someone speaks. The result is a new file; the video is kept as it was."], go: go(4, "Queue this clip") } ] },
    { id: "image", track: "Create", title: "Images only", sub: "stills with Qwen 2.1, FLUX3-K or MOSS-Image", steps: [
      { t: "Switch to image", d: ["Set “The prompt goes to” to “Image only”. The form shrinks to one box, the picture model, a size, how many and a seed."], go: { tab: "Create", step: 0, spot: "The prompt goes to", set: { goes: "image" } } },
      { t: "Pick the picture model", d: ["Only installed models are offered. Qwen 2.1 Turbo is on every install: 8 steps, the quickest. Qwen 2.1 Full is its 40-step base model, where those weights are installed. FLUX3-K Fast (16 steps) and FLUX3-K Full (50 steps) are Black Forest Labs' FLUX 3 Image Klein, installed with --flux3. MOSS-Image (OpenMOSS, 25 steps) is on a DGX Spark installed with --moss: the best at lettering on posters, titles and signs.", "FLUX3-K first writes a full scene description from your prompt (5 to 20 s, once for all the images), so a short prompt is enough. The models have licences of their own (Qwen Research License, FLUX Kommunity License; MOSS-Image is Apache 2.0): read them before commercial use."],
        eg: "One picture at 1344 × 768, model loaded, on a Mac Studio M5 Ultra: Qwen 2.1 Turbo 4.7 s · FLUX3-K Fast 9.8 s · Qwen 2.1 Full 43 s · FLUX3-K Full 60 s", tip: "From our 128-picture test: Qwen 2.1 Turbo for drafts, FLUX3-K Fast as the everyday choice, Qwen 2.1 Full for faces, posters and character sheets, FLUX3-K Full for final frames of busy scenes and hands; on a DGX Spark, MOSS-Image for anything with words in the frame. The same choice is offered for scouts and a last frame.", go: { tab: "Create", step: 0, spot: "Picture model", set: { goes: "image" } } },
      { t: "Make and use them", d: ["“Make image” queues the batch; seeds count up from the one you gave. Each result has “Download” and “animate this”, which takes the image to Create as the first frame of a video."], go: { tab: "Create", step: 0, spot: "Make image", set: { goes: "image" } } } ] },
    { id: "edit", track: "Create", title: "Edit a picture", sub: "change a picture in words, or move the camera round it", steps: [
      { t: "Switch to Edit a picture", d: ["Set “The prompt goes to” to “Edit a picture”. A picture model re-draws a picture you give it: Qwen-Image-2.1, or FLUX3-K Fast or Full where they are installed. “Picture model” at the top chooses when there is more than one.", "Image LoRAs, the camera ring and the 40-step choice are Qwen's; FLUX3-K edits from words and pictures only."], go: { tab: "Create", step: 0, spot: "The prompt goes to", set: { goes: "edit" } } },
      { t: "Give the picture", d: ["Upload one, pick one from the Library, or take a frame of a Library clip: its first frame, its last frame or the frame at a time you type. In the Library, “edit” on a picture opens this step on it."], go: { tab: "Create", step: 0, spot: "1 · The picture", set: { goes: "edit" } } },
      { t: "Change it in words", d: ["Describe the picture you want, not the steps to get there. What you leave out is meant to stay."], eg: "The same statue at night under a full moon, wet paving stones, a lantern on the wall behind it.", tip: "Small things still shift between the two pictures. Compare them before you build a clip on the result.", go: { tab: "Create", step: 0, spot: "2 · What changes", set: { goes: "edit" } } },
      { t: "Further pictures", d: ["Once a picture is in, “Further pictures the prompt can draw on” takes up to nine more. The model sees them all at once: your picture is image 1 and is the one edited, the others are image 2, image 3 and so on, in the order added. Name them that way in the prompt.", "“Size of the result” keeps your picture's own size by default, or makes about 768, 1024 or 1280 pixels a side."], eg: "The man of image 2 stands in the room of image 1, by the window.", tip: "Every further picture makes the edit slower. On a Mac, FLUX3-K Full is slow for edits (240 s for one picture on an M5 Ultra); use FLUX3-K Fast there.", go: { tab: "Create", step: 0, spot: "1 · The picture", set: { goes: "edit" } } },
      { t: "Or move the camera", d: ["With Qwen and the Multiple Angles LoRA (LoRA hub, Fun) “Move the camera” appears. Click directions on the ring: front is at the top and each step is 30° round the subject. Pick a height first, tick Close-up for a tighter frame, or take a ready set such as “Five views around”.", "Each angle is one picture from one load of the model. The LoRA was trained on single objects and characters: a side or back view often comes back on a plain studio background."], tip: "If a result copies your picture instead of moving the camera, lower the LoRA's strength towards 0.8.", go: { tab: "Create", step: 0, spot: "2 · What changes", set: { goes: "edit" } } },
      { t: "Use the results", d: ["Results land under the form and in the Library. Under each: “first frame” opens a new clip on it, “last frame” ends a clip on it, “edit again” feeds it back in. A front view and a back view of the same subject make a first and a last frame for a turn."], go: { tab: "Create", step: 0, spot: "Edit the picture", set: { goes: "edit" } } } ] },
    { id: "queue", track: "Create", title: "The queue", sub: "time left, cancel, logs", steps: [
      { t: "One job at a time", d: ["Everything you queue from any tab lands in the render bay along the bottom and runs in order: clips, pictures, edits, Library actions, voice takes and songs. You can keep working and queue more while a job runs.", "A video, a voice take and a song never run together on one machine: each model is unloaded before the next job starts." + (S.platform === "spark" ? " With more than one Spark chosen in the row at the top of the queue, clips render one per Spark (the Sparks lessons)." : "")], go: { tab: "Create", spot: "Queue" } },
      { t: "Reading a job", d: ["A running job shows its stage and the time left. “Cancel” stops a queued or running job. “Log” shows what the engine printed, which is where to look when a job fails.", "A finished job shows how long it took and which engine ran it. Lines under it can follow: the Wasserman QA gate, the shot check (with “Render it again at seed N”), what the prompt forbids by name, and Sound and movement for a motion reference. Each is a flag beside the clip, never a failed job."], tip: "The list lives in memory. It empties when the app restarts; the files stay in the Library." },
      { t: "Clear the list", d: ["🗑 on a finished job deletes the job and what it made: its clip or stills, its check sheets and a first frame only it used. Tick several jobs and press “Delete selected”. “Clear failed” takes the failed jobs out of the list; “Delete all finished” takes every finished or cancelled job and its files.", "Nothing is erased: the files go to the trash folder, and “Undo” in the message, or “Restore last deletion” in the Library, puts the last deletion back. A clip that is in a film (a project's timeline, a Slate take) stays where it is."], tip: "A queued or running job cannot be deleted: cancel it first.", go: { tab: "Create", spot: "Queue" } } ] },
    ...(S.sharp ? [{ id: "sharp", track: "Create", title: "Wasserman Sharp Spec", sub: "Sam Wasserman's locked recipe and QA gate", steps: [
      { t: "One click, every setting", d: ["The Wasserman Sharp Spec button sits at the top of the video settings in step 1. It sets Sam Wasserman's recipe: 1376 × 768, FastH3 at 8 passes, seed 42, 8 or 10 seconds, one pass and no upscale. Every clip made with it is made the same way.", "Change any of those settings and the button is no longer ticked: the clip then renders as an ordinary one."], go: go(0, "Wasserman Sharp Spec", { start: "text" }) },
      { t: "The QA gate", d: ["After a Sharp Spec clip renders, his QA gate checks it: the spoken line by its transcript, then three frames by a vision model (Claude Code, Codex or a local model, under your own sign-in). A clip that fails is made once more at the next seed.", "The job card shows “Wasserman QA gate” with each take's result and a contact sheet. A gate whose tool is missing on this machine says so and is skipped."], tip: "The next seed after 42 is a retake, not a new recipe. Keep the seed at 42 for the first try.", go: { tab: "Create", spot: "Queue" } },
      { t: "On a whole film", d: ["The same button is on the Production board, beside Output and Quality, and in a Slate film's Bible under “How this film renders”. There it sets every segment or shot to the recipe and seed 42."], go: on("Production", "Wasserman Sharp Spec") } ] }] : []),
    ...(S.platform === "spark" ? [{ id: "memory", track: "Create", title: "Memory on a DGX Spark", sub: "what the memory guard says, and what to do", steps: [
      { t: "The line under the estimate", d: ["On a DGX Spark the picture and the system share one pool of memory. Before you queue a clip, the estimate in step 1 and step 5 adds “about N GB of this machine's memory”, from measured peaks."], go: go(4, "Queue this clip") },
      { t: "“This clip will be refused: memory”", d: ["A clip that would leave the machine under its floor (a tenth of the memory) shows this, with the reason and the nearest size and length that fit. Queue it anyway and the app refuses it. Choose the size or length it names."], tip: "Do not lower the floor to make a clip fit. Since 2.7.1 a LoRA on FastH3 takes what a clip without one takes, up to 1376 × 768 at 10 seconds.", go: go(0, "Length") },
      { t: "A job stopped while it ran", d: ["While a render runs, the guard reads the memory twenty times a second and stops the server if memory falls under the floor, falls too fast, or the kernel reports work stalled on memory. The job then fails with that reason in its error line and its Log."], tip: "Close other programs that hold memory, then queue the clip again. A voice take or a song is unloaded before a clip starts, so it never stands beside one." },
      { t: "On other Sparks", d: ["A clip sent to another Spark passes that Spark's own guard first. A worker that refuses is listed under “Not used” beside the Sparks chooser, with its reason, and the clip is not sent there."], go: go(4, "Sparks") } ] }] : []),
    { id: "production", track: "Production", title: "A film in segments", sub: "plan, render and hand over to the editor", steps: [
      { t: "Projects", d: ["Production is for a film made of several clips. A project holds its segments and its editor timeline. Pick one, rename it, or press “New project”."], go: on("Production", "Project") },
      { t: "One output for all", d: ["“Output for every segment” and “Quality” apply to the whole project, so every segment has the same size and joins cleanly."], go: on("Production", "Output for every segment") },
      { t: "Add segments", d: ["“+ Add a segment” adds one shot. Give it a title and a length. The strip above shows all segments in proportion with the total running time. A new segment copies the scene text of the one before, so you only change what differs."], go: on("Production", "+ Add a segment") },
      { t: "Choose what each segment opens on", d: ["“Nothing” makes a fresh shot from text. “The last frame of the segment before” continues the previous shot without a cut. “An image from the library” opens on a picture: paste its path, copied from the Library tab."], tip: "Use “the last frame of the segment before” for one continuous scene and “nothing” or an image for a cut to a new place.", go: on("Production", "+ Add a segment") },
      { t: "Write each segment", d: ["The boxes mean the same as in Create: the scene, what happens, a voice with one spoken line, and the soundscape. Keep the description of people identical across segments so they stay recognizable."], go: on("Production", "+ Add a segment") },
      { t: "Render", d: ["“Render” on a segment queues just that one. “Generate every segment not yet rendered” queues the rest in order, including any that failed. “Render again” replaces a segment you do not like; change its seed first for a different take."], go: on("Production", "Generate every segment") },
      { t: "Send to the editor", d: ["“Send rendered segments to the editor” puts every rendered segment on the project's timeline, in order, and opens the Timeline (Edit)."], tip: "This replaces the timeline that project had. Trims you made there are lost, so send first and trim after.", go: on("Production", "Send rendered segments") } ] },
    { id: "slate", track: "Production", title: "Wasserman Slate", sub: "plan a film like a crew, render it here", steps: [
      { t: "What it is", d: ["Slate is Sam Wasserman's prompt studio for AI filmmaking. Here its workflow is built into Production and wired to the render queue: you plan the film the way a crew does, and every shot renders without copying a prompt anywhere.", "At the top of Production pick “Wasserman Slate”. Create a film, or open a project.json made in Slate itself."], go: { tab: "Production", slate: true, spot: "Wasserman Slate" } },
      { t: "Let the First AD set it up", d: ["A new film opens on the First AD. Say what you are making in plain words. When it is clear, it creates the scenes and shots, writes their prompts, casts the characters and scouts the locations, and lists what it did."], eg: "A 30 second noir teaser: a detective, a rainy alley, one line of dialogue. Three shots.", tip: "The First AD and every ✦ button use the brain: your own Claude Code or Codex sign-in, or a local model. Pick it in the Bible and press “Test the brain”." },
      { t: "Bible and Studios", d: ["The Bible holds the logline, the world and tone, and how the film renders (resolution, quality). Studios holds the sheets: Casting, Art Department, Locations, Lookbook. Describe something in one line and ✦ Fill writes the sheet.", "In Casting, pin a still to a character (upload one, or have the image model make candidates from the sheet). That still is how the face stays the same from shot to shot."] },
      { t: "Cast a voice", d: ["In Slate's Sound tab a voice sheet has “Cast voice”: Fish Audio Drama 3 speaks the sheet's sample line in the voice the sheet describes, on this machine. The take is kept on the sheet.", "Ticked, it goes into shots that open on cast stills as that speaker's reference audio, so the voice stays the same from shot to shot. “Cast again (next seed)” makes another take; a take over 15 seconds needs “Cut to 15 s”."], tip: "The Voice lessons cover Drama 3 itself: speakers, directions and cloning." },
      { t: "Shots", d: ["Each shot has specs (seconds, size, angle, lens, movement) and a prompt in six sections: Subject, Composition, Lighting, Camera, Style, Mood. ✦ Structure, Tighten, Enrich and the rest rewrite it; a Director's note changes it in plain words; the old version goes to History.", "✦ Coverage turns one scene description into a full set of shots from a coverage plan."] },
      { t: "Roll camera", d: ["Under the prompt, choose what the shot opens on: text only, the last frame of the shot before, an image, or the cast's stills. Tick who is in the shot, add spoken lines, a soundscape and a cue.", "The shot is compiled to MiniMax H3's own prompt form, with a preflight list of anything that will not fit. “🎬 Render this shot” queues it; the clip comes back as a take. Circle the take that works."], tip: "A shot is 1 to 15 seconds: it renders at the nearest length the model takes (17n + 5 frames), so a 6 second shot is 141 frames, 5.875 s." },
      { t: "Deliver", d: ["Deliver shows a scene as a strip. “Render every shot without a take” queues the scene in order; a shot that opens on the shot before starts from its last frame. “Send the film's takes to the Timeline (Edit)” puts the circled takes on the timeline, in order.", "The shot list downloads as Markdown or CSV, and the Bible downloads the project.json, which opens in Slate."] } ] },
    { id: "slatefilm", track: "Production", title: "A whole film in Slate, start to finished video", sub: "one sitting: idea, shots, renders, the final file", steps: [
      { t: "Start the film", d: ["This lesson takes one idea all the way to a finished video file without leaving the app. Open Story → Film, pick “Wasserman Slate”, type a name for the film and press “Create”.", "Everything you make is saved as you go in the film's own folder, in Slate's project format."], go: { tab: "Production", slate: true, spot: "Wasserman Slate" } },
      { t: "Check the brain once", d: ["Open the Bible and press “Test the brain”. The brain is what writes prompts: your own Claude Code or Codex sign-in, or a local model. If the test answers, every ✦ button and the First AD will work."], tip: "No brain on this machine? You can still write each shot by hand in Shots and render it; only the ✦ buttons need the brain." },
      { t: "Tell the First AD the whole film", d: ["Go to ✦ First AD and describe the film in plain words: the length, the scenes, who is in it, what is said. It builds the scenes and shots, writes each prompt, casts the characters, scouts the locations and adds the spoken lines. The list under its answer shows what it did."], eg: "A 40 second horror short in two scenes. Scene 1, a roller rink at night: a girl skates alone, the disco ball stops. Scene 2, the car park: she runs to her car and says “Start. Please start.” Five shots in all, 8 seconds each.", tip: "Ask for changes the same way: “make shot 3 a close-up” or “add a shot of the empty rink at the end”." },
      { t: "Set how the film renders", d: ["In the Bible, under “How this film renders”, pick the resolution and quality for every shot. “Wasserman Sharp Spec” sets Sam Wasserman's locked recipe and runs his QA gate on each clip. The Keys and Wasserman LoRA Hub below it gives the whole film one look, for example the 80s horror LoRA."], tip: "Try the film at the 480p tier first. When the shots are right, switch the tier and render the keepers again." },
      { t: "Keep the faces the same", d: ["In Studios, open Casting. For each character press “Make reference pictures from the sheet” or upload a still, and keep the one you like. In a shot, choose “Cast stills” as what it opens on and tick who is in it: the face then comes from the still."], tip: "Cast stills render on the reference model, which is slower and takes no LoRA. For a shot with no close faces, “Text only” or “The shot before” is quicker." },
      { t: "Read one shot before rendering all", d: ["Open Shots and click a shot. Under the six-section prompt is “Roll camera”: what the shot opens on, who is in it, the spoken lines and the soundscape. The box under that is the exact prompt the video model gets, with a preflight list of anything that will not fit.", "Press “🎬 Render this shot” on one shot first and watch it. Fix the prompt with a Director's note if it is not right."] },
      { t: "Render the film", d: ["Open Deliver. “Render every shot without a take” queues each scene in order. A shot set to open on the shot before starts from that shot's last frame, so the cut is continuous. The render bay along the bottom shows each clip as it is made."], tip: "You can close the page. The queue keeps rendering, and the takes are on the shots when you come back." },
      { t: "Give notes and regenerate", d: ["Each render comes back on its shot as a take, in Shots and in Deliver. Under every clip is a box for notes: what to keep and what to fix. “↻ Regenerate” queues a new take of that shot.", "With notes, the brain first revises the shot's prompt to answer them, and the old prompt goes to History. With the box empty, it is the same prompt at the next seed. The takes you already have are kept; circle the one to use."], eg: "Her face changes at the end. Slower push-in. She should say the line more firmly.", tip: "Say one or two things per regenerate. A long list of changes gives the model too much to move at once." },
      { t: "Send to the Timeline (Edit) and export", d: ["In Deliver press “Send the film's takes to the Timeline (Edit)”. The circled takes land on the timeline in story order. In the Timeline (Edit), trim with In and Out, press “▶ Play the sequence” to watch the film, pick the size and press “Export”. “Download the export” is your finished video."], tip: "Sending replaces the timeline of the current project, so send first and trim after.", go: on("Editor", "Export") } ] },
    { id: "lora", track: "Create", title: "Keys and Wasserman LoRA Hub", sub: "give a clip a trained look, add your own LoRAs", steps: [
      { t: "What a LoRA does", d: ["A LoRA is a small file that teaches the video model one look or subject: a film stock, an era, a style. The hub is the library of them. Pick one and the clip is rendered with it.", "The hub is in the video settings of Create, on the Production board and in a Slate film's Bible."], go: go(0, "Keys and Wasserman LoRA Hub") },
      { t: "Install and pick one", d: ["Each LoRA on this machine is a button under the hub's name: a click picks it (✓) and another click drops it. To install one, open “▸ Browse the hub” and press “⤓ Install” on its card: it shows the licence first, then takes the file from a LoRA bundle on this machine or from its author's page.", "The first preset is the Wasserman-80's Horror LORA by Sam Wasserman: the look of a 1970s-80s horror movie."], tip: "Weights are never part of this app. Each LoRA's file comes from its author under its own licence; read it before you download.", go: go(0, "Keys and Wasserman LoRA Hub") },
      { t: "Look and strength", d: ["A picked LoRA shows a row. “Look” chooses between its looks when it has several (VHS or 16mm film for the 80s horror LoRA). “Strength” is how hard it pushes: start at the value it was made for, go lower for a hint, higher for more.", "The trigger word and the look phrase are added to the start of your prompt for you. Do not type them yourself."], eg: "80s horror: strength 1.0 is the standard, 0.6 is subtle, 1.3 is strong.", go: go(0, "Keys and Wasserman LoRA Hub") },
      { t: "Write the prompt for it", d: ["Write the scene as usual: the light and the place, what happens and the turn, one camera move, the sound. Leave out words for the look itself, such as “film grain” or “retro”: the LoRA brings those."], eg: "Cold fluorescent mall light, a dead shopping mall after hours. A mannequin in a prom dress steps off its pedestal and walks stiffly toward the camera.", go: go(0, "Describe the scene") },
      { t: "LoRAs that need a reference clip", d: ["Three LoRAs do one job on a clip made from references, and the row of a picked one says what it needs and whether the clip has it. Character Swap: your clip as Video 1 and a picture of the new character; under Video 1 say who is replaced. Lineart Anime: a line-art video as Video 1; “Make line art of Video 1” draws one from any clip (white lines on black), and Scene and Action describe the finished picture. Keyframe Animation: one or two drawings as pictures, at 20 passes.", "The prompt in Review is then written the way that LoRA was trained. On a DGX Spark such a clip runs on the full-precision reference model, with or without Turbo."], eg: "Lineart Anime on a clip of a dancer: Video 1 becomes her outline, the prompt says “a girl with long blue hair in a white dress, on a moonlit stage”.", go: go(0, "Keys and Wasserman LoRA Hub") },
      { t: "Browse the hub by group", d: ["“▸ Browse the hub” opens the whole library in groups: Wasserman, 01 Camera & Viewpoint, 02 Transformation & Morphing, 03 Character Editing, 04 Motion & Action, 05 Art Style, 06 Support & Finishing, 07 Fun. Pick a group, or type in the search box (orbit, anime, fight, speech).", "Each card says what the LoRA does, who made it, what it works from, its licence and its size. “⤓ Install” puts it on this machine; “Use on this clip” adds it to the clip you are making, with its trigger word written into the prompt for you. A LoRA for pictures says “Use in Edit a picture”; one that drives a Library action says “Open the Library”.", "A card marked “Not supported in the Studio yet” says why: some LoRAs need their author's own workflow, or run on one machine only. A line above the cards counts how many are usable on this machine."], tip: "“Installed only” shows what is on this machine. “Install all in this category” takes a whole group at once.", go: go(0, "Keys and Wasserman LoRA Hub") },
      { t: "A slider LoRA", d: ["Most LoRAs take a strength between about 0.3 and 1.2. A slider LoRA, such as Anime Slider, also takes minus values: plus leans one way (2D anime), minus the other (photographic). The Strength box of a picked LoRA shows its author's range."], eg: "Anime Slider at 3 for flat 2D anime, at -3 for a photographic look.", go: go(0, "Keys and Wasserman LoRA Hub") },
      { t: "Offline: the LoRA bundle", d: ["A LoRA bundle is a folder with every preset's file in it (scripts/lora-bundle.py builds one from the authors' pages). With a folder named lora-bundle in your studio folder, or LORA_BUNDLE set, the hub installs from it with no network, and a fresh install has every usable preset ready at the first start.", "The page on each card is the author's: it is there for credit and for the file's licence."], go: go(0, "Keys and Wasserman LoRA Hub") },
      { t: "What changes in the render", d: ["A clip with a LoRA shows no time estimate. " + (S.platform === "spark" ? "On a DGX Spark a LoRA on FastH3 is merged into TensorFold's int8 engine, at the same memory as a clip without one. A Spark whose engine predates 2.7.1 uses ComfyUI's own blocks instead: slower, and at most 1280 × 736 at 124 frames." : "On a Mac, FastH3 moves from the native engine to the MLX engine, which is slower; MiniMax H3 at 20 steps is what most LoRAs were made for."), "A look LoRA is not applied to a clip made from references; only the three in “LoRAs that need a reference clip” are. You can stack up to four."], tip: "Compare with and without: render once with the LoRA, drop it, and render again with the same seed." },
      { t: "Add your own", d: ["In “▸ Browse the hub”, “+ Add your own LoRA” opens a recipe form: a name, the download address of the .safetensors file or an uploaded file, the trigger word, the strength, and optional looks written as name = phrase. “Add to the hub” makes it a button on this machine, next to the presets."], tip: "The file has to be a LoRA for MiniMax H3. One made for another model is refused when you add it.", go: go(0, "▸ Browse the hub") } ] },
    { id: "motion", track: "Motion Previs", title: "Motion Previs, from a shot to a new clip", sub: "analyse a shot, then make a clip that moves like it", steps: [
      { t: "What Motion Previs is for", d: ["Motion Previs reads a shot you already have and takes its movement apart: the camera move in words, a pose skeleton, a depth layer, edges and a motion mask. The analysis is a port of Motion Previs Studio by Sam Wasserman (wassermanproductions.com).", "Use it when a new clip should move like an old one: the same drill with another person, the same fight in another place, or only the same camera move. A reference video without the analysis is a plain reference: the model sees the clip and nothing tells it what to keep."], tip: "The analysis runs on the processor beside the render queue. A 5 second shot with every layer took 6.6 s on a Mac Studio M5 Ultra and 13 to 18 s on a DGX Spark.", go: on("Motion Previs", "1 · The shot") },
      { t: "Load the shot", d: ["Under “1 · The shot” press “Upload a clip”, or “Pick from the studio folder” for an earlier render or upload. Then choose the part to analyse: 2 to 15 seconds.", "“Upload a pack ZIP” takes a pack exported by Motion Previs Studio in place of an analysis."], tip: "Pick the few seconds where the move you want happens. A shorter range is analysed faster and followed more closely.", go: on("Motion Previs", "1 · The shot") },
      { t: "Reference mode", d: ["“2 · Reference mode” says what the new clip keeps. Camera only: just the camera move and its timing. Actor motion: the body motion and the camera, with a new person and place. Object motion: an object's or a vehicle's path and the camera. Full scene: camera, blocking, subject motion and depth rhythm.", "The mode does not change what is measured. It sets what the pack's notes and the hand-off ask the model to keep, and you can change it again later."], eg: "The same dummy drill with another fighter on the same rooftop: Full scene.\nThe same push-in on a different subject: Camera only.", go: on("Motion Previs", "2 · Reference mode") },
      { t: "Layers and their settings", d: ["“3 · Layers” lists what is made: a depth proxy, AI depth, pose with an OpenPose skeleton, the camera move, edges, line art, a motion mask and a normals proxy. Leave them all ticked the first time.", "Samples a second: 12 is the original's setting; 24 follows every frame of a Studio clip. Pose model: Lite is fastest, Heavy most exact. Then press “Run analysis”: each stage shows its own progress and Cancel keeps nothing."], tip: "The pose pass follows one person only. Asked for up to four people on a two-person duel, it returned one in every frame.", go: on("Motion Previs", "3 · Layers") },
      { t: "Read the result", d: ["“4 · Review” shows the shot's length, size and a quality figure, then “The camera move, in words” with its numbers: pan and tilt in pixels, zoom, roll and a confidence.", "Below it the reference, the skeleton, the depth and the edges play side by side: “▶ Play all together” starts them in step. Check that the skeleton sits on the person and that the sentence matches what you see."], eg: "The camera pushes in a long way while it tilts down across about a third of the frame. The move starts gently and gathers pace toward the end of the shot.", tip: "A pan and a sideways track look alike to this solve. With a low confidence, read the sentence against the clip before you use it.", go: on("Motion Previs", "4 · Review") },
      { t: "Send it to a new clip", d: ["“5 · Motion reference” picks the layer that becomes <Video 1>: the reference clip itself (the tested route), the OpenPose skeleton, AI depth, or none for the camera move in words only. Set the length, the size and the timing (fit the whole shot to the length, or keep its speed).", "“Use as motion reference” opens the create wizard on its references screen with that layer as <Video 1> and the camera move ready for the prompt."], tip: "For the same place with a new person send the reference clip. For a new place send AI depth with a picture of the opening frame: depth kept the moves nearly as well in our tests.", go: on("Motion Previs", "5 · Motion reference") },
      { t: "Add the picture of who or where", d: ["In the wizard's step 2 the motion is <Video 1>. Add a picture as <Picture 1>: with the source clip it is who replaces the person; with a depth or skeleton layer it is the opening frame, and the look and the place come from it.", "You can also start here without the Motion Previs tab: add a reference video and press “Analyse motion” under it."], tip: "Use pictures you have the right to use. A clear, front-facing, well-lit picture holds a face best.", ...(S.ref_media ? { go: go(1, "Add videos", { start: "refs" }) } : {}) },
      { t: "What to carry over, and how many people", d: ["Under “Motion of <Video 1>”: “What to carry over” is the reference mode again, and “What goes to the model as <Video 1>” is the layer. Full scene defaults to the source clip, the other three to depth.", "“People in <Video 1>”: One, or Two or more. With two or more the prompt speaks of its people one for one. You have to say it: the analysis does not count them."], eg: "A duel with a picture of a new pair, People set to One: only one fighter was replaced.\nThe same with Two or more: both were.", ...(S.ref_media ? { go: go(1, "Add videos", { start: "refs" }) } : {}) },
      { t: "Sound and movement", d: ["A reference is followed at its own speed, whatever the prompt says. “Sound and movement” keeps the sound honest about it. Impacts: fast strikes and blocks, with their sound. Flow: slow movement, silent or under music. Automatic never lays hits over a reference that moves slowly.", "Impacts over a slow reference leaves the video out and lets the picture and the prompt carry the fight; the camera move stays, in words. Flow takes the hits out of the soundscape, and without music the clip is delivered silent."], tip: "When the clip is done its job card says “Sound and movement: agree”, or “impact sound over slow motion” in red. It is a flag beside the clip, never a failed job.", ...(S.ref_media ? { go: go(1, "Add videos", { start: "refs" }) } : {}) },
      { t: "The mouth, and the camera sentence", d: ["“Keep the mouth of <Video 1> out of the clip” is on when nobody speaks: the mouth of the person in the source clip is smoothed over before the model sees it. Left in, the new face mouths that person's words.", "“Add the camera move to the prompt” writes the solved sentence into the prompt. If the Camera field of step 1 has text of its own, that text is used instead."], tip: "The mouth switch turns itself off when the clip has spoken lines or reuses the video's own sound: then the mouth should be followed.", ...(S.ref_media ? { go: go(1, "Add videos", { start: "refs" }) } : {}) },
      { t: "Passes: Turbo 4, 3 or 20", d: [S.ref2va_turbo ? "Turbo 4 passes is the one to start with: the dummy drill took 231 s on the Mac and held the motion as closely as 20 passes did in 741 s. Custom sets a number of your own: 3 passes held the drill as well, though it was not quicker in our one run." : "Reference clips run 20 plain passes on this machine; the Turbo adapter (4 passes, about 2.5 times faster) comes with the --ref2va option of the installer.", "A reference video makes every pass slower than a clip from text, so keep test clips at 5 seconds and 864x480."], eg: "Dummy drill, 5 s at 864x480 on a Mac Studio M5 Ultra:\nTurbo 4 passes 231 s · 20 passes 741 s", ...(S.ref2va ? { go: go(0, "Reference to video", { start: "refs" }) } : {}) },
      { t: "Two worked examples", d: ["The dummy drill with a new person: analyse the drill, Full scene, the source clip as <Video 1>, a picture of the new person, People: One, Turbo 4 passes. She does the drill and the push-in on the same rooftop.", "The duel with two people: the same route with a picture of the new pair and People: Two or more. For hits you can hear choose Impacts; for the slow sticky hands of the source choose Flow."], eg: "Duel on the Mac: source clip 284 s · Impacts 89 s · Flow 262 s\nDuel on a DGX Spark: source clip 216 s · Impacts 101 s · Flow 206 s", tip: "One seed each, so expect some run-to-run difference.", go: on("Motion Previs", "Motion Previs") },
      { t: "When it goes wrong", d: ["The person drifts out of frame or loses the moves: on a Mac this was the Turbo adapter with the int8 kernels and a reference video; the app now runs that case in bfloat16. If you still see it, try 20 passes. Only one of two fighters is replaced: set People to Two or more.", "The fight stays slow under hit sounds: the reference is slow, so choose Impacts (the video is left out) or Flow (no hits). The new face mouths words: leave the mouth switch on. Music nobody asked for: the model adds it by itself, even when told not to; Flow without music mutes the track."], tip: "The distance figures in the README are how far the body's keypoints are from the source's, in percent of the frame width, median and 90th percentile. Under about 5 and 12 the motion was held; 26 and 37 was a lost clip.", go: on("Motion Previs", "4 · Review") } ] },
    { id: "voice", track: "Voice", title: "Speech with Fish Audio Drama 3", sub: "lines, speakers and directions, on this machine", steps: [
      { t: "What the Voice tab does", d: ["Voice turns text into speech with Fish Audio Drama 3, on this machine through TensorFold's port: MLX on a Mac, native CUDA on a DGX Spark. Nothing is sent to Fish Audio.", "Each take is a job in the queue. The model loads on the first take (about 5 s on a Mac, 18 s on a Spark), stays loaded for five idle minutes, and is unloaded at once when a video or picture job starts."], go: on("Voice", "Voice") },
      { t: "Write what is said", d: ["Type the words in “What is said”. Speaker tags switch voices: <|speaker:0|> to <|speaker:15|>, one turn on each line. Directions in square brackets steer the delivery: [whispering], [sighs], [laughs], or a description of the voice.", "Long text is split at sentence ends and keeps one voice. “Two-speaker example” fills the box with a short dialogue."], eg: "<|speaker:0|> [whispering] Did you hear that noise downstairs?\n<|speaker:1|> [sighs] It's probably just the cat. Go back to sleep.", go: on("Voice", "What is said") },
      { t: "Seed and sampling", d: ["Seed picks the take: the same text and seed give the same take again. Temperature, Top-p and Top-k are Fish's sampling settings; “Fish defaults” puts back 1.0, 0.9 and 30. Leave them there unless a take keeps going wrong."], go: on("Voice", "Temperature") },
      { t: "Render the take", d: ["“Render the take” queues it. The take plays in the tab while it is made, the first sound a fraction of a second after it starts on a loaded model. Whisper checks the words: a part with missing words is drawn again when it has not been played yet, or reported, and the take's line shows how many words were heard."], tip: S.voice && S.voice.checks ? "Untick “Play while it is made” to have a part with missing words drawn again before you hear it: sound already played cannot be taken back." : "Speak about three words a second: a line meant for a 5 second clip has about 15 words.", go: on("Voice", "Render the take") },
      { t: "Clone a voice", d: ["Under “Voice to clone (optional)”, add a clean recording of one speaker, about 10 to 30 seconds, and type what it says (left empty, Whisper writes it). Tick the consent box: the take will not render without it.", "Without a clip, Drama 3 makes a voice of its own: describe it in a direction, such as [a deep, gravelly man in his fifties, slow and patient]."], tip: "Clone a real person's voice only with their consent. A hosted voice or cloning service needs Fish Audio's own licence.", go: on("Voice", "Voice to clone") },
      { t: "Use the takes", d: ["Under each take in “Takes”: “Download WAV”; “Clone this voice” makes it the voice of the next take, for the same speaker across lines; “Again, next seed” puts the text back for another try; and “Use as Ref2VA voice reference” takes it to a MiniMax H3 reference clip as its voice (2 to 15 seconds)."], tip: "In Slate, a voice sheet's “Cast voice” uses the same engine for a film's cast.", go: on("Voice", "Takes") } ] },
    { id: "music", track: "Music", title: "A song with MiniMax-Music3", sub: "lyrics, a style, and a song under a video", steps: [
      { t: "What the Music tab does", d: ["Music makes a whole song with sung vocals from your lyrics and a style, on this machine: up to five minutes, 44.1 kHz stereo. The model is MiniMax-Music3, run by TensorFold: on a Mac by its own port, on a DGX Spark by its CUDA engine (or ComfyUI's nodes where that engine is not built). The tab says which runs here.", "One song at a time in the queue, never beside a video or a voice take."], go: on("Music", "Music") },
      { t: "Write the lyrics", d: ["Put section tags on lines of their own, above the lines they hold. The buttons under the box add [Intro], [Verse], [Pre-Chorus], [Chorus], [Bridge], [Instrumental] and [Outro]. Lines in (parentheses) are backing vocals. Leave the box empty for an instrumental.", "A note under the box says when there are no tags, or a tag the model may sing as words. “Pop example” fills both boxes."], go: on("Music", "Lyrics") },
      { t: "Describe the style", d: ["The style is a caption: genre, tempo, key, mood, the voice that sings and the instruments. The Style helper has a box for each; “Write the style” turns them into the caption, which you can still edit."], eg: "Hip-hop anthem, 92 BPM, boom-bap drums and deep 808 bass. Confident male rap vocal.", go: on("Music", "Style helper") },
      { t: "Length, seed, Generate", d: ["Length (s) is the longest the song may be, 10 to 300; the model may end it sooner. Seed picks the take. “Generate” queues it, with the time it will take beside the button."], eg: "A 60 s song through the app in 2.9.1: about 63 s on a Mac Studio M5 Ultra (MLX engine), about 149 s on a DGX Spark (CUDA engine).", go: on("Music", "Length (s)") },
      { t: "Hear it while it is made", d: ["On a Mac with the MLX engine, “Play while it's made” plays the song in the tab as it is made. TensorFold's Metal engine on an M5 or later does not stream yet: there the song plays when it is done, and MUSIC3_BACKEND=mlx runs the MLX engine instead. It starts once enough is made that it never stops: about 13 s into a 60 s song. A DGX Spark plays the song when it is done.", "Ticked, “Have Whisper listen for the lyrics after” gives a rough score: sung words are harder to hear than spoken ones."], go: on("Music", "Generate") },
      { t: "Lay it under a video", d: ["Under a song in “Songs”, “Use as soundtrack” opens a row: choose a video (a long video, the Timeline's export or any Library clip), set the Music level in dB, and press “Lay it under”. The song is lowered while someone speaks, and no peak goes over -1 dBFS. The result is a new file in exports.", "“Again, next seed” puts the lyrics and style back for another take."], tip: "The tab, and any page that plays a song, must say “MiniMax-Music3”: its licence asks for that in a commercial product.", go: on("Music", "Songs") } ] },
    { id: "editor", track: "Editor", title: "Cut and export", sub: "timeline, trims and the final file", steps: [
      { t: "Put clips on the timeline", d: ["The media bin at the bottom shows your videos; hover one to play it. “+ timeline” adds it to the end of the timeline. Clips also arrive from Create (“Add to the editor timeline”), the Library and Production."], tip: "The timeline belongs to the project selected in Story → Film.", go: on("Editor", "Media bin") },
      { t: "Order the clips", d: ["On each timeline clip, ← and → move it and ✕ removes it from the timeline. The file itself stays in the Library. Click a clip to show it in the preview."], go: on("Editor", "Timeline") },
      { t: "Trim with In and Out", d: ["In and Out are seconds within the clip. In 0.5 skips the first half second; Out 4 stops at four seconds. Out left at 0 plays the clip to its end."], eg: "A 5 s clip with In 0.5 and Out 4.2 contributes 3.7 s.", tip: "Trim the first few frames of clips that open on the last frame of another, so the join does not stutter.", go: on("Editor", "Timeline") },
      { t: "Play the sequence", d: ["“▶ Play the sequence” plays the timeline from the first clip with your trims applied. The line under it shows the total length."], go: on("Editor", "▶ Play the sequence") },
      { t: "Export", d: ["Pick the size next to the button and press “Export”. The export runs in the queue; when it is done the result plays here with “Download the export”."], tip: "Pick the size your clips were rendered at or the next one up. Exporting much larger than the source does not add detail.", go: on("Editor", "Export") },
      { t: "A song under the export", d: ["Once the Music tab has a song, “Song under the export” appears under the Export button. Pick a song and a Music level in dB: the export then has the song under the clips' own sound, lowered while someone speaks."], go: on("Editor", "Export") } ] },
    { id: "library", track: "Library", title: "Find and reuse your files", sub: "clips, images and their paths", steps: [
      { t: "What is in the Library", d: ["Every clip, scout, image and export the app has made, as files under " + S.home + ". They stay there when the app restarts."], go: on("Library", "Library") },
      { t: "Copy a path", d: ["Click the name under a file to copy its path. Paste it into a Production segment that opens on “an image from the library”."], go: on("Library", "Library") },
      { t: "Reuse a file", d: ["Under a video: “continue” starts a new clip on its last frame, and “+ timeline” adds it to the editor timeline. Under a picture: “use” makes it the first frame of a new clip, “last frame” ends a new clip on it, and “edit” opens Edit a picture on it (“new angle” too, with the Multiple Angles LoRA installed).", "A clip rendered on another Spark shows that Spark's name and its seed beside the file name."], go: on("Library", "Library") },
      { t: "Delete files", d: ["🗑 on a tile takes the file out of the Library after you confirm. To delete several, tick them (or “Select all”) and press “Delete selected”. Deleted files are moved to the “trash” folder inside " + S.home + ", not erased.", "“Restore last deletion” puts the files of the last deletion back where they were. “Empty trash” shows how much the trash holds and, after you confirm, erases it for good: that is the one step that cannot be undone, and the one that frees the disk space."], tip: "A file that a queued or running job needs cannot be deleted until the job is done.", go: on("Library", "Library") },
      { t: "Clear what you typed", d: ["Every form has a Clear button: “Clear this step” and “Clear all” at the foot of the create wizard, “Clear” on a segment and “Clear every segment's text” on the production board, “Clear” above a Slate shot's prompt, and “Clear” in the Voice and Music tabs. It empties the text only; pictures, clips, titles and settings stay.", "“Undo” in the message, or the “Undo clear” button that appears beside Clear, puts the text back until you close or reload the page."], go: { tab: "Create", spot: "Clear all" } } ] },
    { id: "actions", track: "Library", title: "Library actions", sub: "turn a picture round, enlarge a clip, take a person out", steps: [
      { t: "Turn a picture round", d: ["Under a picture, “Turnaround” makes five views of its subject, turning from where it faces now. They are made together, so the character stays the same in all five.", "Each view is a picture of its own in the Library: “first frame” starts a clip on it, “reference” adds it to a reference clip's pictures. 512 is the fastest size; 1024 is the one to keep."], tip: "“The turn” goes furthest round. “The look” turns less and stays closer to your picture.", go: on("Library", "Turnaround") },
      { t: "Make a clip larger", d: ["Under a clip, “Upscale” makes it larger and sharper: the picture is enlarged, then drawn over once, lightly, with the clip itself as the guide. Mouths, motion and the clip's own sound stay as they were.", "2 megapixels is about 1920 × 1080. “Light” is the tested re-draw; “None” only enlarges."], go: on("Library", "Upscale") },
      { t: "Take a person out", d: ["Under a clip, “Remove a person” takes one person out and draws the background again. Say who in a few words (“man in a gray shirt”), then press “1. Find the person”: the person comes back painted green. Check hands, hair and shadow before the long render.", "“2. Remove the person” then works through the clip in overlapping pieces. It needs a first frame without the person: the app builds one from the clip, or you load your own edit of the first frame."], tip: "Best on a short, continuous shot. The whole picture is drawn again, so small details elsewhere can change. The clip's own sound still holds the removed person's voice: tick “No sound” to leave it out.", go: on("Library", "Remove a person") } ] },
    { id: "sparks", track: "Sparks", title: "More than one DGX Spark", sub: "how many machines a job may use", steps: [
      { t: "What the Sparks setting does", d: ["On a DGX Spark a job may use more than one Spark: Sparks, 1 to 8, is how many, this one counted. Several clips (jobs in the queue, a board's segments, a Slate scene's shots) render one per Spark, side by side, and come back into this Spark's Library and project as if made here.", "One clip renders on one Spark. A long video, pictures, edits, Library actions, voice takes and songs stay on this Spark." + (S.platform === "spark" ? "" : " On a Mac the Mac leads them: single FastH3 clips a Spark renders with its own settings go to the Sparks, through the Spark that leads them when this Mac cannot reach them, and the rest stays on this Mac.")], eg: "Eight 56-frame clips at 864 × 480, FastH3 8 passes, through the app: 263 s on one Spark, 130 s on two, 69 s on four.", go: on("Sparks", "Sparks") },
      { t: "Choose the number", d: ["The same row of numbers is at the top of the render bay in every room, in step 5 of Create, on the Production board and on a Slate shot. Choose more than there are and the app uses what is there: “5 of 8 available”.", "Under the row the app says what the number does for this job, with an estimate, and lists any Spark not used and why (busy, down, no memory, or missing a LoRA or model the clip needs)."], go: go(4, "Sparks") },
      { t: "Add a Spark", d: ["In the Sparks tab, under “Add a Spark”, type its address as you would after ssh and press “Add”. The other Spark needs the Studio installed once (oneshot-setup-spark.sh) and a key login from this one: no password is asked, and nothing runs as root."], go: on("Sparks", "Add a Spark") },
      { t: "Check, update, start, stop", d: ["Each row shows whether the Spark answers, its Studio's version, memory and disk free, what it can render and whether it is busy. “Check” only looks. “Update and start” sends this Spark's Studio code (not the models) and starts its app. “Stop” frees its memory. Untick “use” to keep it in the list without giving it clips."], tip: "A worker's app listens only on its own 127.0.0.1; this app reaches it through an ssh tunnel it opens itself.", go: on("Sparks", "This Spark and") },
      { t: "When a Spark goes quiet", d: ["A worker that does not answer for 60 seconds during a job is marked down, and its clip goes back to the queue for another Spark. The job card says “Taken back from” that Spark, with the reason. Press “Check” on it before it is used again."], tip: "Not measured: six to eight Sparks (five were tested). One clip split across several Sparks is not in the app." } ] },
    { id: "access", track: "Studio", title: "Your phone and other devices", sub: "the access key, once per device", steps: [
      { t: "On this computer: nothing to do", d: ["A browser on the computer running the studio (opened as localhost) never asks for a key, and neither do updates there.", "The access key is only for reaching the studio from somewhere else: your phone, a tablet, another computer."] },
      { t: "Let your phone reach the studio", d: ["Install Tailscale on the computer and on the phone, signed in to the same account (free for personal use).", "On the computer, run once in a terminal: tailscale serve --bg " + (location.port || "7870") + ". Only your own devices can open that address, over HTTPS."], tip: "On a trusted home network the studio can also be opened to the network (HOST=0.0.0.0): every device there is asked for the key too." },
      { t: "Scan the QR code", d: ["On the computer, open Settings → Access key. Point the phone's camera at the QR code and open the link: the studio opens on the phone, already signed in.", "Then Share → Add to Home Screen (iPhone) or ⋮ → Add to Home screen (Android): the studio opens full screen from its own icon, and stays signed in."], go: on("Settings", "Access key") },
      { t: "No camera? Type the key", d: ["In Settings → Access key press Show (or Copy) and type the key on the device when the studio asks: “Sign this device in”. In a terminal on the computer, bash scripts/studio-key.sh prints it too."], tip: "The key is a password to your studio: send it only to your own devices." },
      { t: "A lost phone: make a new key", d: ["Settings → Access key → Make a new key. Every other device is signed out at once; the browser you pressed it in stays signed in. Sign your devices in again with the new QR code."] },
